name: Build Droi APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: droi-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Validate Droi patches and ARM64 static filesystem probe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check guest scripts and run static ARM64 probe
        run: |
          set -euo pipefail
          bash -n linux/droi-apps
          bash -n linux/droi-shell-session
          python3 -m py_compile linux/droi-shell
          python3 tests/test_droi_shell.py
          bash -n linux/droi-doctor
          sh -n linux/opencode
          python3 tests/test_windows_launcher.py
          cc -O2 -static -Wall -Wextra -Werror tests/static-fs-probe.c -o /tmp/droi-static-probe
          DROI_PROBE=/tmp/droi-static-probe bash linux/droi-doctor
      - uses: actions/checkout@v4
        with:
          repository: Droid-Deck/DroidDeck
          ref: d38fd373f0caf6574458abc574640f2d961d09d9
          path: upstream
          sparse-checkout: |
            /*
            !/docs/releases/media/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check patches before the APK build
        run: |
          git -C upstream apply --check ../patches/android.patch ../patches/linux.patch
          git -C upstream apply ../patches/android.patch ../patches/linux.patch
          bash -n upstream/tools/linuxfs/desktop/droiddeck-desktop
          grep -Fq 'dbus-run-session -- /usr/bin/droi-shell-session' upstream/tools/linuxfs/desktop/droiddeck-desktop
          grep -Fq -- '-displayfd 3' upstream/tools/linuxfs/desktop/droiddeck-desktop
          python3 tests/test_desktop_catalog.py upstream/tools/linuxfs/desktop/droiddeck-desktop

  xbox:
    name: Prepare shared ARM64 runtime dependencies
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Droid-Deck/DroidDeck
          ref: d38fd373f0caf6574458abc574640f2d961d09d9
          sparse-checkout: |
            /*
            !/docs/releases/media/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Plan component identities
        id: plan
        run: python3 tools/components/prepare.py plan
      - uses: actions/cache@v4
        id: xbox-cache
        with:
          path: |
            app/src/main/assets/linuxfs/usr/local/lib/droiddeck-xbox
            app/build/xbox/xodus-droiddeck-source.tar.xz
            app/build/xbox/runtime/*-source.tar.xz
          key: xbox-v2-${{ steps.plan.outputs.xbox }}
      - name: Build Xbox backend
        if: steps.xbox-cache.outputs.cache-hit != 'true'
        run: python3 tools/components/prepare.py xbox
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-arm64
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-xbox
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-corresponding-source
          path: |
            app/build/xbox/xodus-droiddeck-source.tar.xz
            app/build/xbox/runtime/*-source.tar.xz
          if-no-files-found: error

  components:
    name: Prepare Linux and Android components
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Droid-Deck/DroidDeck
          ref: d38fd373f0caf6574458abc574640f2d961d09d9
          sparse-checkout: |
            /*
            !/docs/releases/media/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resolve the pinned Android NDK
        run: bash tools/ci/resolve-ndk.sh
      - name: Check out MaliBridge
        run: git submodule update --init external/MaliBridge

      - uses: actions/checkout@v4
        with:
          path: .droi
          persist-credentials: false
      - name: Stage ChatGPT PRoot fix
        run: |
          set -euo pipefail
          install -m 0644 .droi/chatgpt-proot.patch tools/proot/patches/0030-statx-empty-path.patch
          grep -q 'AT_EMPTY_PATH' tools/proot/patches/0030-statx-empty-path.patch
      - name: Plan component identities
        id: plan
        run: python3 tools/components/prepare.py plan
      - name: Cache remaining Linux runtime assets
        id: preloads
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/linuxfs
            !app/src/main/assets/linuxfs/usr/local/lib/droiddeck-comet
            !app/src/main/assets/linuxfs/usr/local/lib/droiddeck-xbox
            !app/src/main/assets/linuxfs/i386/libddsession.so
            !app/src/main/assets/linuxfs/i386/libfakeinput.so
            !app/src/main/assets/linuxfs/i386/libfaultreport.so
            !app/src/main/assets/linuxfs/libddaudit.so
            !app/src/main/assets/linuxfs/libddfastpath.so
            !app/src/main/assets/linuxfs/libddnatv-hook.so
            !app/src/main/assets/linuxfs/libddsession.so
            !app/src/main/assets/linuxfs/libfakeinput.so
            !app/src/main/assets/linuxfs/libssbs.so
            !app/src/main/assets/linuxfs/usr/local/bin/droiddeck-clipboard
            !app/src/main/assets/linuxfs/x86_64/libddsession.so
            !app/src/main/assets/linuxfs/x86_64/libfakeinput.so
            !app/src/main/assets/linuxfs/x86_64/libfaultreport.so
            !app/src/main/assets/linuxfs/x86_64/libvulkan-thunk.so
            !app/src/main/assets/linuxfs/x86_64/libwebkitinput.so
          key: runtime-v9-${{ steps.plan.outputs.runtime }}

      - name: Cache PulseAudio 13.0 source
        id: pa-src
        uses: actions/cache@v4
        with:
          path: pa13
          key: pulseaudio-src-${{ steps.plan.outputs.pulseaudio-source }}
      - name: Cache proot
        id: proot
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libproot.so
            app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          key: proot-v2-${{ steps.plan.outputs.proot }}
      - name: Cache GOG Galaxy companion
        id: comet
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-comet
          key: comet-v2-${{ steps.plan.outputs.comet }}

      - name: Restore verified preload snapshots
        id: component-preloads
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PRELOAD_REBUILD: 'true'
        run: python3 tools/components/prepare.py preload-snapshot

      - name: Prepare required Linux build tools once
        env:
          COMPONENTS_TO_BUILD: >-
            ${{ steps.preloads.outputs.cache-hit != 'true' && 'runtime' || '' }}
            ${{ steps.component-preloads.outputs.arm64 != 'true' && 'arm64-preloads' || '' }}
            ${{ steps.comet.outputs.cache-hit != 'true' && 'comet' || '' }}
            vkbridge
        run: python3 tools/components/prepare.py tools

      - name: Build changed ARM64 preloads
        if: steps.component-preloads.outputs.arm64 != 'true'
        run: python3 tools/components/prepare.py arm64-preloads

      - name: Prepare remaining Linux runtime assets
        if: steps.preloads.outputs.cache-hit != 'true'
        run: python3 tools/components/prepare.py runtime

      - name: Build the Mali bridge's Linux side
        run: python3 tools/components/prepare.py vkbridge

      - name: Fetch the Debian image the preloads build in
        if: steps.component-preloads.outputs.x86 != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: Droid-Deck/DroidDeck
        run: python3 tools/components/prepare.py debian-image

      - name: Build the x86 preloads FEX guests load (glibc 2.31)
        if: steps.component-preloads.outputs.x86 != 'true'
        run: python3 tools/components/prepare.py x86-preloads

      - name: Bundle the droiddeck-esync packs
        run: python3 tools/components/prepare.py esync

      - name: Fetch PulseAudio 13.0 source
        if: steps.pa-src.outputs.cache-hit != 'true'
        run: python3 tools/components/prepare.py pulseaudio-source

      - name: Fetch DirectAudio (tools/directaudio/release.env)
        run: python3 tools/components/prepare.py directaudio

      - name: Build the AAudio sink into the audio bundle
        run: python3 tools/components/prepare.py audio

      - name: Build proot
        if: steps.proot.outputs.cache-hit != 'true'
        run: python3 tools/components/prepare.py proot

      - name: Build the non-Adreno test additions (Mali bridge client, Venus GL probe, Xclipse layer)
        run: |
          set -euo pipefail
          bash tools/ci/install-ubuntu-packages.sh gcc-aarch64-linux-gnu libc6-dev-arm64-cross libvulkan-dev
          D=app/src/main/assets/linuxfs
          mkdir -p "$D/usr/local/bin" "$D/usr/local/lib/droiddeck-xclipse"
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Wno-unused-parameter -fvisibility=hidden -pthread \
            -o "$D/usr/local/lib/droiddeck-xclipse/libVkLayer_droiddeck_xclipse.so" tools/linuxfs/xclipse-layer/xclipse_layer.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/usr/local/lib/droiddeck-xclipse/libVkLayer_droiddeck_xclipse.so"
          install -m644 tools/linuxfs/xclipse-layer/VkLayer_droiddeck_xclipse.json "$D/usr/local/lib/droiddeck-xclipse/"
          aarch64-linux-gnu-gcc -O2 -Wall -o "$D/usr/local/bin/droiddeck-glprobe" tools/venus/glprobe.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/usr/local/bin/droiddeck-glprobe"

      - name: Check the preloads
        run: |
          set -euo pipefail
          bash tools/linuxfs/check-preloads.sh app/src/main/assets/linuxfs
          D=app/src/main/assets/linuxfs
          VKB="$D/usr/local/lib/vkbridge/libvulkan_droidbridge.so"
          test -f "$VKB" && test -f "$D/usr/local/share/vkbridge/droidbridge_icd.json" && test -f "$D/usr/local/bin/droiddeck-vkbridge-smoke"
          VKB_NEED=$(readelf -d "$VKB" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' | grep -vx 'libc.so.6' | grep -vx 'ld-linux-aarch64.so.1' || true)
          [ -z "$VKB_NEED" ] || { echo "::error::the bridge ICD needs $VKB_NEED"; exit 1; }
          [ "$(readelf -Ws "$VKB" | awk '$4 == "FUNC" && $5 == "GLOBAL" && $7 != "UND" {sub(/@.*/, "", $8); print $8}' | grep -c '^vk_icd')" = 3 ] || { echo "::error::the bridge ICD does not export the loader interface"; exit 1; }

      - name: Build GOG Galaxy companion
        if: steps.comet.outputs.cache-hit != 'true'
        run: python3 tools/components/prepare.py comet

      - name: Build the DiRT 3 / DiRT Showdown ws2_32 stand-in
        run: python3 tools/components/prepare.py dirt-ws2

      - name: Cache graphics driver inputs
        uses: actions/cache@v4
        with:
          path: app/build/quest-inputs
          key: quest-inputs-${{ hashFiles('tools/quest/build-driver.py') }}
      - name: Prepare graphics driver variants
        run: python3 tools/quest/build-driver.py "$ANDROID_HOME/ndk/$NDK_VERSION"
      - name: Record and pack prepared components
        run: python3 tools/components/prepare.py pack
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-components
          path: app/build/prepared-components.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  build:
    name: Compile and verify ARM64 APK
    needs: [checks, components, xbox]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Droid-Deck/DroidDeck
          ref: d38fd373f0caf6574458abc574640f2d961d09d9
          sparse-checkout: |
            /*
            !/docs/releases/media/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: .droi
          persist-credentials: false
      - name: Stage ChatGPT PRoot fix
        run: |
          set -euo pipefail
          install -m 0644 .droi/chatgpt-proot.patch tools/proot/patches/0030-statx-empty-path.patch
          grep -q 'AT_EMPTY_PATH' tools/proot/patches/0030-statx-empty-path.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-cleanup: ${{ github.event_name == 'pull_request' && 'never' || 'on-success' }}

      - name: Resolve the pinned Android NDK
        run: bash tools/ci/resolve-ndk.sh

      - name: Rust toolchain for the store engines (aarch64-linux-android)
        id: rust
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          echo "rustc=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          rustc -V; cargo -V

      - name: Cache cargo registry and the store engines' target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            app/src/main/rust/stores/target
          key: stores-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.NDK_VERSION }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('app/src/main/rust/stores/Cargo.lock') }}-${{ hashFiles('app/src/main/rust/stores/src/**', 'app/src/main/rust/stores/Cargo.toml', 'app/src/main/rust/stores/build.rs', 'app/src/main/rust/stores/.cargo/**', 'app/build.gradle') }}
          restore-keys: |
            stores-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.NDK_VERSION }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('app/src/main/rust/stores/Cargo.lock') }}-
            stores-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.NDK_VERSION }}-${{ steps.rust.outputs.rustc }}-

      - name: cargo-ndk
        run: |
          set -euo pipefail
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Cache the CMake build tree
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: cxx-${{ env.NDK_VERSION }}-${{ hashFiles('app/src/main/cpp/**', 'tools/vr/src/xr_*.h') }}
          restore-keys: |
            cxx-${{ env.NDK_VERSION }}-

      - uses: actions/download-artifact@v4
        with:
          name: prepared-components
          path: app/build
      - name: Verify and unpack prepared components
        run: python3 tools/components/prepare.py unpack --tree "$(git rev-parse 'HEAD^{tree}')"

      - name: Restore the Ubisoft launcher build
        id: ubisoft-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-ubisoft
          key: ubisoft-launcher-v1-${{ steps.rust.outputs.rustc }}-${{ hashFiles('tools/ubisoft-launcher/src/**', 'tools/ubisoft-launcher/Cargo.toml', 'tools/ubisoft-launcher/Cargo.lock', 'tools/ubisoft-launcher/build.sh', 'tools/ubisoft-launcher/build.rs', 'tools/ubisoft-launcher/.cargo/**') }}
      - name: Ubisoft launcher service (x86_64-pc-windows-gnu)
        if: steps.ubisoft-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          command -v x86_64-w64-mingw32-gcc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64; }
          bash tools/ubisoft-launcher/build.sh
      - name: Save the Ubisoft launcher build
        if: steps.ubisoft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-ubisoft
          key: ${{ steps.ubisoft-cache.outputs.cache-primary-key }}

      - name: Restore the Rockstar launcher build
        id: rockstar-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-rockstar
          key: rockstar-launcher-v1-${{ steps.rust.outputs.rustc }}-${{ hashFiles('tools/rockstar-launcher/src/**', 'tools/rockstar-launcher/Cargo.toml', 'tools/rockstar-launcher/Cargo.lock', 'tools/rockstar-launcher/build.sh', 'tools/rockstar-launcher/build.rs', 'tools/rockstar-launcher/.cargo/**') }}
      - name: Rockstar launcher service (32-bit and 64-bit)
        if: steps.rockstar-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          command -v i686-w64-mingw32-gcc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-i686; }
          command -v x86_64-w64-mingw32-gcc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64; }
          bash tools/rockstar-launcher/build.sh
      - name: Save the Rockstar launcher build
        if: steps.rockstar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-rockstar
          key: ${{ steps.rockstar-cache.outputs.cache-primary-key }}

      - name: Restore the Epic launcher build
        id: epic-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-epic
          key: epic-launcher-v1-${{ steps.rust.outputs.rustc }}-${{ hashFiles('tools/epic-launcher/src/**', 'tools/epic-launcher/Cargo.toml', 'tools/epic-launcher/Cargo.lock', 'tools/epic-launcher/build.sh', 'tools/epic-launcher/build.rs', 'tools/epic-launcher/.cargo/**') }}
      - name: Epic Games Launcher parent stand-in (x86_64-pc-windows-gnu)
        if: steps.epic-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          command -v x86_64-w64-mingw32-gcc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64; }
          bash tools/epic-launcher/build.sh
      - name: Save the Epic launcher build
        if: steps.epic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-epic
          key: ${{ steps.epic-cache.outputs.cache-primary-key }}

      - uses: actions/download-artifact@v4
        with:
          name: xbox-arm64
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-xbox

      - name: Cache checksum-pinned pack inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/droiddeck-pack-inputs
            ~/.cache/droiddeck-build
          key: pack-inputs-v2-${{ hashFiles('tools/packs/build.sh', 'tools/packs/fetch-verified.sh', 'tools/packs/tracking/release.env', 'tools/packs/zstd/release.env', 'tools/powervr/release.json') }}
          restore-keys: pack-inputs-v2-
      - name: Build the add-on packs
        run: |
          python3 tools/powervr/fetch.py
          bash tools/packs/build.sh app/build/packs

      - name: Pin the Syncthing source
        id: syncthing-src
        run: |
          set -euo pipefail
          git submodule update --init --recursive tools/syncthing/syncthing-android
          echo "commit=$(git -C tools/syncthing/syncthing-android/syncthing/src/github.com/syncthing/syncthing rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache Syncthing
        id: syncthing
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libsyncthingnative.so
          key: syncthing-${{ env.NDK_VERSION }}-${{ hashFiles('tools/syncthing/build.sh', 'tools/syncthing/syncthing-android/gradle/libs.versions.toml') }}-${{ steps.syncthing-src.outputs.commit }}
      - uses: actions/setup-go@v5
        if: steps.syncthing.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false
      - name: Build Syncthing
        if: steps.syncthing.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          tools/syncthing/build.sh app/src/main/jniLibs/arm64-v8a

      - name: Check the proot pack pin against this build
        run: |
          set -euo pipefail
          source tools/packs/proot/release.env
          sha=$(sha256sum app/build/packs/proot.tar.zst | cut -d' ' -f1)
          size=$(stat -c %s app/build/packs/proot.tar.zst)
          if [ "$sha" != "$PROOT_PACK_SHA256" ] || [ "$size" != "$PROOT_PACK_SIZE" ]; then
            level=warning
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then level=error; fi
            echo "::$level::built proot pack $sha ($size bytes) does not match tools/packs/proot/release.env ($PROOT_PACK_SHA256, $PROOT_PACK_SIZE bytes). Source builds download the pinned pack, so set PROOT_PACK_SHA256=$sha and PROOT_PACK_SIZE=$size in tools/packs/proot/release.env."
            if [ "$level" = error ]; then exit 1; fi
          fi

      - name: Check out MaliBridge
        run: git submodule update --init external/MaliBridge
      - name: Fetch the Mali (Venus) component (tools/venus/release.env)
        run: |
          set -euo pipefail
          . tools/venus/release.env
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o venus.tzst \
            "https://github.com/${VENUS_REPO}/releases/download/${VENUS_TAG}/venus.tzst"
          echo "${VENUS_SHA256}  venus.tzst" | sha256sum -c -
          tar --use-compress-program=unzstd -xf venus.tzst -C app/src/main
          test -f app/src/main/jniLibs/arm64-v8a/libvirgl_test_server.so
          test -f app/src/main/assets/venus/libvulkan_virtio.so
          rm venus.tzst

      - name: Apply the desktop launcher
        run: |
          git apply --check .droi/patches/android.patch .droi/patches/linux.patch
          git apply .droi/patches/android.patch .droi/patches/linux.patch
          install -Dm644 .droi/android/DroiUpdates.kt app/src/main/java/com/droiddeck/launcher/DroiUpdates.kt
          install -Dm644 .droi/android/DesktopLauncherActivity.kt app/src/main/java/com/droiddeck/launcher/DesktopLauncherActivity.kt
          for script in droi-apps droi-doctor droi-windows droi-shell droi-shell-session opencode; do
            install -Dm755 ".droi/linux/$script" "tools/linuxfs/overlay/usr/bin/$script"
          done
          bash tools/ci/install-ubuntu-packages.sh gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          mkdir -p app/src/main/assets/linuxfs/usr/local/bin
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra -Werror .droi/tests/static-fs-probe.c -o app/src/main/assets/linuxfs/usr/local/bin/droi-static-probe
          # Fail CI if the desktop silently falls back to native LD_PRELOAD
          # translation, which cannot translate paths in static ARM64 Codex.
          grep -Fq 'SessionState.mode != MODE_DESKTOP &&' app/src/main/java/com/droiddeck/launcher/session/SessionService.kt
          grep -Fq 'val fastPathKey = if (ProotFastPath.enabled(this, nativeUserland))' app/src/main/java/com/droiddeck/launcher/session/SessionService.kt
          # Ship the exact fixed native PRoot build inside the APK; the
          # external DroidDeck pack server cannot provide this custom digest.
          install -Dm644 app/build/packs/proot.tar.zst app/src/main/assets/packs/proot.tar.zst
          test -s app/src/main/assets/packs/proot.tar.zst
          install -m644 tools/linuxfs/desktop/droiddeck-desktop app/src/main/assets/linuxfs/usr/local/bin/droiddeck-desktop

      - name: Build APK
        env:
          DROIDDECK_BUILD_LABEL: Droi Desktop
        run: |
          set -euo pipefail
          python3 tools/powervr/fetch.py
          # Verify compressed pack integrity before spending time compiling the APK.
          for pack in app/build/packs/*.tar.zst; do
            zstd -tq "$pack" || { echo "Corrupt pack: $pack" >&2; exit 1; }
          done
          python3 tools/release/runtime_inputs.py record
          export DROI_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          export DROI_VERSION_NAME="0.7.1-droi.$GITHUB_RUN_NUMBER"
          ./gradlew assembleRelease --console=plain -PndkVersion="$NDK_VERSION"
          python3 tools/release/check_session_assets.py app/build/outputs/apk/release/app-release.apk
          python3 tools/release/runtime_inputs.py apk app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Droi-Desktop-arm64.apk

      - name: Verify APK signature
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs dist/Droi-Desktop-arm64.apk
          unzip -tq dist/Droi-Desktop-arm64.apk
          unzip -l dist/Droi-Desktop-arm64.apk | grep -F "assets/linuxfs/usr/local/bin/droi-static-probe"

      - uses: actions/upload-artifact@v4
        with:
          name: Droi-Desktop-APK
          path: dist/Droi-Desktop-arm64.apk
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-apk.yml
